name: Android (APK test + AAB Play Store)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nom de version affiché (ex. 1.0.0)"
        default: "1.0.0"
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
      VERSION_CODE: ${{ github.run_number }}
      # Secrets de signature (voir README). Sans eux : seul l'APK debug est produit.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances du site
        run: |
          bun install
          bun add -d @fontsource/noto-serif-jp @fontsource/zen-kaku-gothic-new

      - name: Build du site (statique, hors ligne)
        run: bunx vite build -c vite.spa.config.ts
        env:
          VITE_OFFLINE: "1"

      - name: Embarquer MediaPipe + tracés KanjiVG
        run: node scripts/prepare-offline.mjs

      - name: Projet Android
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#b3261e' --iconBackgroundColorDark '#b3261e'
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            echo "SIGN=1" >> "$GITHUB_ENV"
          fi
          SIGN=$([ -n "$KEYSTORE_B64" ] && echo 1 || echo 0) python3 scripts/patch-android.py
          npx cap sync android

      - name: APK de test (debug)
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: AAB signé pour le Play Store
        if: env.SIGN == '1'
        working-directory: android-app/android
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: bashoji-apk-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: env.SIGN == '1'
        with:
          name: bashoji-play-aab
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab
